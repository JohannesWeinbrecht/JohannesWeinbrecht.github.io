<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ADA Slides</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/theme/white.css"
		/>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section>
					<h1>My Presentation</h1>
					<p>A reveal.js presentation — edit me!</p>
				</section>

				<section>
					<h2>Slide 2</h2>
					<ul>
						<li>First bullet point</li>
						<li>Second bullet point</li>
					</ul>
				</section>

				<section>
					<h2>Slide 3</h2>
					<p>Add your content here.</p>
					<aside class="notes">
						Speaker notes for slide 3.
					</aside>
				</section>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/markdown.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/highlight.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/notes.js"></script>
		<script>
			Reveal.initialize({
				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});
		</script>
	</body>
</html>
